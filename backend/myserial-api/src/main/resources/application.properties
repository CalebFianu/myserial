spring.application.name=myserial-api

# Datasource
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/myserial}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:cal1234B}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=3600s

# TMDB
tmdb.api-key=${TMDB_API_KEY:1840ec6fd1b0c9ae36cde8d80fbbc07d}
tmdb.base-url=https://api.themoviedb.org/3
tmdb.image-base-url=https://image.tmdb.org/t/p

# TMDB Seeding
tmdb.seed.enabled=true
tmdb.seed.cron=0 0 4 * * *
tmdb.seed.export-base-url=http://files.tmdb.org/p/exports
tmdb.seed.export-lookback-days=3
tmdb.seed.roster-size=100
tmdb.seed.hydrate-per-run=100
tmdb.seed.refresh-per-run=25
tmdb.seed.refresh-after-days=14
tmdb.seed.request-delay-ms=300
tmdb.seed.run-on-startup=false

# JWT
jwt.secret=${JWT_SECRET:KGoU6fDpO4disQRWDtatFqFECGBE8ukABMSv4BvZbVjBVP9IAZ2DQl6FBmS3mE/5j4RxY6Byn2fu2O3CSffG9w==}
jwt.access-token-expiry=900
jwt.refresh-token-expiry=2592000

# Springdoc / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# Server
server.port=${PORT:8080}

# Logging
logging.level.com.myserial=INFO
logging.level.org.hibernate.SQL=DEBUG
