spring.datasource.url=jdbc:tc:postgresql:15:///myserial_test
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

tmdb.api-key=test-key
tmdb.base-url=https://api.themoviedb.org/3
tmdb.image-base-url=https://image.tmdb.org/t/p

jwt.secret=test-secret-key-at-least-32-chars-long-for-hmac256
jwt.access-token-expiry=900
jwt.refresh-token-expiry=2592000

logging.level.com.myserial=DEBUG
