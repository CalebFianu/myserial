services:
  postgres:
    image: postgres:16-alpine
    container_name: myserial-postgres
    environment:
      POSTGRES_DB: myserial
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cal1234B
    ports:
      - "5432:5432"
    volumes:
      - myserial_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myserial"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: myserial-redis
    ports:
      - "6379:6379"
    volumes:
      - myserial_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myserial-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/myserial
      DATABASE_USER: postgres
      DATABASE_PASSWORD: cal1234B
      JWT_SECRET: ${JWT_SECRET}
      TMDB_API_KEY: ${TMDB_API_KEY}
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  myserial_pgdata:
  myserial_redis:
